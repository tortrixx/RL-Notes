name: Build PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts (ori template defaults)
        run: |
          set -e
          mkdir -p ~/.local/share/fonts
          # IBM Plex Serif / Mono
          base=https://raw.githubusercontent.com/IBM/plex/master/packages
          for f in \
            plex-serif/fonts/complete/otf/IBMPlexSerif-Regular.otf \
            plex-serif/fonts/complete/otf/IBMPlexSerif-Italic.otf \
            plex-serif/fonts/complete/otf/IBMPlexSerif-Medium.otf \
            plex-serif/fonts/complete/otf/IBMPlexSerif-SemiBold.otf \
            plex-serif/fonts/complete/otf/IBMPlexSerif-SemiBoldItalic.otf \
            plex-serif/fonts/complete/otf/IBMPlexSerif-Bold.otf \
            plex-serif/fonts/complete/otf/IBMPlexSerif-BoldItalic.otf \
            plex-mono/fonts/complete/otf/IBMPlexMono-Regular.otf \
            plex-mono/fonts/complete/otf/IBMPlexMono-Medium.otf \
            plex-mono/fonts/complete/otf/IBMPlexMono-SemiBold.otf \
            plex-mono/fonts/complete/otf/IBMPlexMono-Bold.otf; do
            curl -sfL -o "$HOME/.local/share/fonts/$(basename "$f")" "$base/$f"
          done
          # Noto Serif SC (static weights — the Google variable font has an ExtraLight default instance)
          curl -sfL -o /tmp/noto-serif-sc.zip \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/14_NotoSerifSC.zip
          unzip -q -o /tmp/noto-serif-sc.zip -d /tmp/noto-serif-sc
          cp /tmp/noto-serif-sc/SubsetOTF/SC/*.otf "$HOME/.local/share/fonts/"
          fc-cache -f

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          cache-dependency-path: main.typ

      - name: Compile
        run: typst compile main.typ main.pdf

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest main.pdf \
            --title "Latest build" \
            --notes "Auto-built from \`main\` by GitHub Actions"

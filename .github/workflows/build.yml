name: Build PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 字体已 vendored 在 fonts/(见 CLAUDE.md),无需再安装;--ignore-system-fonts
      # 保证编译只依赖仓库内字体,与本地、typst.app 云端渲染一致
      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          cache-dependency-path: main.typ

      - name: Compile
        # 固定为作者所在时区(UTC+8):封面日期取编译当日,UTC 下凌晨推送会印成"昨天"
        env:
          TZ: Asia/Shanghai
        run: typst compile --font-path fonts --ignore-system-fonts main.typ RL-Notes.pdf

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest RL-Notes.pdf \
            --title "Latest build" \
            --notes "Auto-built from \`main\` by GitHub Actions"

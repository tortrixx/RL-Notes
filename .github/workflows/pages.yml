name: Deploy PDF to GitHub Pages

# 触发时机:
# - workflow_run:Build PDF 流程成功完成后(推送 main 由 build.yml 编译并自动
#   发布 latest release)。注意不能用 release 事件监听自动构建——CI 用
#   GITHUB_TOKEN 创建的 release 不会触发 release published 事件(GitHub 防递归规则)
# - release published:手动发布的 Release(浏览器/个人 token 创建)
# - workflow_dispatch:手动重新部署当前 latest release
on:
  workflow_run:
    workflows: ["Build PDF"]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 串行部署,避免并发 run 相互覆盖
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    # build 失败时不要部署旧 PDF
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PDF from release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "RL-Notes.pdf"

      # 推送/手动重跑走这里:下载 latest。连续推送时 build 会先删后建
      # release,存在短暂窗口,故带重试
      - name: Download latest release PDF
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            if gh release download latest \
              --repo "${{ github.repository }}" \
              --pattern "RL-Notes.pdf"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      # 仅托管 PDF(无 index.html,访问根路径会 404;直链 /RL-Notes/RL-Notes.pdf)
      - name: Stage Pages directory
        run: |
          mkdir -p _site
          mv RL-Notes.pdf _site/RL-Notes.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
